<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo_da_pagina }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>{{ h1_pagina }}</h1>

    <form method="POST"> 

        <input type="text" id="tituloTarefa" name="tituloTarefa" 
        value="{{ tarefa_edicao.titulo if tarefa_edicao }}">

        <input type="date" id="dataConclusao" name="dataConclusao" 
        value="{{ tarefa_edicao.data_conclusao if tarefa_edicao }}">

        <button type="submit">{{ botao_submit }}</button>
        <a href="/" style='{{ botao_voltar }}'>Voltar</a> 
    </form>

    <ul id="listaTarefas" style="{{ lista }}">
        {% for tarefa in tarefas_da_pagina %}
            <li>
                {{ tarefa.titulo_tarefa }} - {{ tarefa.data_conclusao }}

                <a href="/delete/{{ tarefa.id_tarefa }}">Apagar</a>
                <a href="/edit/{{ tarefa.id_tarefa }}">Editar</a>
            </li>
        {% endfor %}
    </ul>

</body>
</html>
